<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b110d">
  <title>Salle de contrôle</title>
  <link rel="stylesheet" href="./salle.css">
</head>
<body>
  <header class="top">
    <div class="brand"><b>L’ARCHITECTE</b><span>salle de contrôle</span></div>
    <div class="pills">
      <span class="pill" id="p-jeu"><i></i><em>Jeu</em><strong>—</strong></span>
      <span class="pill" id="p-cerveau"><i></i><em>Cerveau</em><strong>—</strong></span>
      <span class="pill" id="p-depense"><em>Dépense</em><strong>—</strong></span>
    </div>
  </header>

  <main class="grid">
    <section class="col live-col">
      <figure class="live">
        <img id="live" alt="Ce que voit l’Architecte" hidden>
        <div class="live-empty" id="live-empty">En attente d’une image du jeu…</div>
        <div class="halt" id="halt" hidden></div>
        <figcaption>
          <span class="mode" id="mode">—</span>
          <span class="intent" id="intent">—</span>
          <span class="where" id="where">—</span>
        </figcaption>
      </figure>

      <div class="stats">
        <div><em>Corps</em><strong id="s-corps">—</strong></div>
        <div><em>Santé</em><strong id="s-pv">—</strong></div>
        <div><em>Joueur</em><strong id="s-joueur">—</strong></div>
        <div><em>Monde</em><strong id="s-monde">—</strong></div>
      </div>

      <div class="controls">
        <div class="ctrl">
          <em>Cerveau</em>
          <div class="seg" id="seg-cerveau">
            <button data-cerveau="vif">Vif</button><button data-cerveau="equilibre">Équilibré</button><button data-cerveau="maximal">Maximal</button>
          </div>
        </div>
        <div class="ctrl">
          <em>Plafond par séance</em>
          <label class="money"><input id="plafond" type="number" min="0" max="200" step="0.5" inputmode="decimal"><span>$</span></label>
        </div>
        <div class="ctrl row">
          <button id="b-pause" class="btn">Mettre en pause</button>
          <button id="b-presence" class="btn">Faire venir</button>
          <button id="b-camera" class="btn primary">Laisse-le travailler</button>
        </div>
        <p class="notice" id="notice" hidden></p>
        <div class="ctrl row toggles">
          <label><input type="checkbox" id="t-voix"> Voix</label>
          <label><input type="checkbox" id="t-vue"> Vue en direct</label>
          <label><input type="checkbox" id="t-atelier"> Atelier automatique</label>
        </div>
      </div>
    </section>

    <section class="col journal-col">
      <div class="col-head"><h2>Fil de pensée</h2><label class="filter"><input type="checkbox" id="f-pensees" checked> pensées</label></div>
      <button class="fresh" id="fresh" hidden>↑ Nouveau</button>
      <ol class="journal" id="journal"></ol>
      <form class="say" id="say">
        <input id="say-text" maxlength="500" autocomplete="off" placeholder="Parler à l’Architecte…">
        <button class="btn primary">Envoyer</button>
      </form>
    </section>

    <section class="col side-col">
      <div class="col-head"><h2>Carte</h2>
        <div class="seg small" id="seg-carte"><button data-zoom="pres" class="on">Autour de lui</button><button data-zoom="ile">Île</button></div>
      </div>
      <canvas id="carte" class="carte"></canvas>

      <div class="col-head"><h2>Tickets</h2>
        <div class="seg small" id="seg-tickets"><button data-filtre="valider" class="on">À valider <b id="n-valider">0</b></button><button data-filtre="cours">En cours</button><button data-filtre="clos">Clos</button></div>
      </div>
      <ul class="tickets" id="tickets"></ul>

      <div class="atelier" id="atelier"><em>Atelier</em><strong>—</strong></div>
    </section>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="sheet">
      <div class="viewer">
        <img id="m-photo" alt="">
        <button class="nav prev" id="m-prev" aria-label="Photo précédente">‹</button>
        <button class="nav next" id="m-next" aria-label="Photo suivante">›</button>
        <div class="thumbs" id="m-thumbs"></div>
      </div>
      <div class="details">
        <button class="close" id="m-close" aria-label="Fermer">×</button>
        <div class="m-tags" id="m-tags"></div>
        <h3 id="m-titre"></h3>
        <h4>Constat</h4><p id="m-constat"></p>
        <h4>Piste</h4><p id="m-piste"></p>
        <h4>Lieu</h4><p id="m-lieu"></p>
        <h4>Fil</h4><ol class="fil" id="m-fil"></ol>
        <section class="workshop" id="m-workshop" hidden>
          <h4>Atelier <span id="m-ws-state"></span></h4>
          <ol class="steps" id="m-steps"></ol>
          <div class="row"><code id="m-cmd"></code><button type="button" class="btn" id="m-copy">Copier</button><button type="button" class="btn" id="m-open">Ouvrir dans le Terminal</button></div>
        </section>
        <form class="decide" id="m-decide">
          <textarea id="m-texte" rows="2" placeholder="Une raison, une précision (facultatif ; demandé pour « Demander plus »)"></textarea>
          <div class="row">
            <button type="button" class="btn ok" data-action="valider">Valider <kbd>V</kbd></button>
            <button type="button" class="btn no" data-action="rejeter">Rejeter <kbd>R</kbd></button>
            <button type="button" class="btn" data-action="plus">Demander plus <kbd>D</kbd></button>
            <button type="button" class="btn" data-action="atelier" id="m-atelier" hidden>Renvoyer à l’atelier</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden><img alt=""></div>
  <script type="module" src="./salle.js"></script>
</body>
</html>
