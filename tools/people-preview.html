<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>Studio</title>
<style>html,body{margin:0;height:100%;background:#20242a}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../vendor/three/build/three.webgpu.js","three/webgpu":"../vendor/three/build/three.webgpu.js","three/tsl":"../vendor/three/build/three.tsl.js","three/addons/":"../vendor/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three/webgpu';
import { loadPerson, loadGun } from '../js/people-assets.js';
import { createPersonMaterials, createGunMaterial } from '../js/people-material.js';
import { loadMocap } from '../js/mocap.js';
import { Skeleton } from '../js/person-body.js';
import { BodyDriver, HOLD } from '../js/person-motion.js';

const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.append(renderer.domElement);
await renderer.init();
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8a97a8);
const sun = new THREE.DirectionalLight(0xfff0dc, 3.2);
sun.position.set(2.2, 3.2, 3);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcd0ff, 0.9);
fill.position.set(-3, 1.5, 1);
scene.add(fill);
scene.add(new THREE.HemisphereLight(0xcfd8e8, 0x4a4238, 1.3));
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 48), new THREE.MeshStandardNodeMaterial({ color: 0x565a60, roughness: 0.9 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
scene.updateMatrixWorld(true);
scene.matrixWorldAutoUpdate = false;

await loadMocap();
const ids = (q.get('id') || 'hero').split(';');
const people = await Promise.all(ids.map(loadPerson));
const cast = people.map((person) => ({ person, skeleton: new Skeleton(person), materials: createPersonMaterials(person) }));
// kind:aim:speed:yawOffset, one per body
const setups = (q.get('set') || 'pistol:0:0,pistol:1:0,rifle:0:0,rifle:1:0').split(',').map((s) => s.split(':'));
const STAND = (y) => y + 1;
for (const [i, [kind, aim, speed, face]] of setups.entries()) {
  const { person, skeleton, materials } = cast[i % cast.length];
  const x = (i - (setups.length - 1) / 2) * (+(q.get('gap') || 1.6));
  const yaw = +(q.get('yaw') || 0) + +(face || 0);
  const rig = {
    x, z: 0, yaw, speed: +speed, vx: Math.sin(yaw) * speed, vz: Math.cos(yaw) * speed, s: 0.9717, pelvisY: 1, standingHeight: STAND, bank: 0, crouch: +(q.get('crouch') || 0), handsUp: 0, punch: 0,
    reloading: +(q.get('reload') || -1), lookTurn: 0, punchSide: 1, aim: aim === '1' ? { x: x + Math.sin(yaw) * 20, y: 1.4, z: Math.cos(yaw) * 20 } : null, pose: new Float32Array(47 * 4)
  };
  const driver = new BodyDriver(skeleton, q.get('female') === '1', i * 0.13);
  const k = kind === '-' ? null : kind;
  for (let f = 0; f < +(q.get('frames') || 90); f++) driver.update(1 / 60, rig, k);
  const mesh = new THREE.SkinnedMesh(person.geometry, materials);
  mesh.frustumCulled = false;
  const bones = person.bones.map(() => new THREE.Bone());
  mesh.add(...bones);
  const sk = new THREE.Skeleton(bones, skeleton.inverse);
  mesh.bind(sk, new THREE.Matrix4());
  scene.add(mesh);
  mesh.updateMatrixWorld(true);
  driver.body.write(bones);
  sk.update();
  if (k) {
    const gun = await loadGun(k);
    const w = new THREE.Mesh(gun.geometry, createGunMaterial(gun));
    w.matrixAutoUpdate = false;
    w.matrix.compose(driver.gunP, driver.gunQ, new THREE.Vector3(1, 1, 1));
    w.matrixWorld.copy(w.matrix);
    scene.add(w);
  }
}
const W = innerWidth, H = innerHeight;
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 30), W / H, 0.05, 80);
const [cx, cy, cz, tx, ty, tz] = (q.get('cam') || '0,1.3,7.5,0,1.05,0').split(',').map(Number);
cam.position.set(cx, cy, cz);
cam.lookAt(tx, ty, tz);
cam.updateMatrixWorld();
await renderer.renderAsync(scene, cam);
await new Promise((r) => setTimeout(r, 300));
await renderer.renderAsync(scene, cam);
document.title = 'done';
</script>
