<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>Studio des armes</title>
<style>html,body{margin:0;height:100%;background:#20242a;overflow:hidden}canvas{display:block}#labels{position:fixed;inset:0;pointer-events:none;font:12px ui-monospace,monospace;color:#fff}#labels span{position:absolute;background:#000a;padding:1px 4px}</style>
<div id="labels"></div>
<script type="importmap">{"imports":{"three":"../vendor/three/build/three.webgpu.js","three/webgpu":"../vendor/three/build/three.webgpu.js","three/tsl":"../vendor/three/build/three.tsl.js","three/addons/":"../vendor/three/examples/jsm/"}}</script>
<script type="module">
// How the people of the game hold, carry and draw their weapons, without the city: one row per set-up, one column per
// camera. ?set=pistol:aim,rifle:carry:3.9,shotgun:draw@0.5 (kind:state:speed) &cams=180:10:2.6,90:5:2.2 (azimuth from the
// front in degrees : elevation : distance) &look=hero &carry=pistol,shotgun,rifle &ty=1.1 &fov=32 &pitch=0
// States: stow, carry, ready, aim, fire, reload@0..1, draw@0..1, holster@0..1. The page title becomes "done" when drawn.
import * as THREE from 'three/webgpu';
import { CharacterModel, LOOKS, loadCharacters } from '../js/characters.js';
import { PersonRig } from '../js/pedestrians.js';

const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.append(renderer.domElement);
await renderer.init();
const scene = new THREE.Scene();
scene.background = new THREE.Color(+(q.get('bg') || 0x9aa6b6));
const sun = new THREE.DirectionalLight(0xfff0dc, 3.4);
sun.position.set(2.2, 4.2, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 6, bottom: -6, near: 0.5, far: 30 });
sun.shadow.bias = -0.0004;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcd0ff, 0.9);
fill.position.set(-3, 1.5, -2);
scene.add(fill);
scene.add(new THREE.HemisphereLight(0xcfd8e8, 0x4a4238, 1.3));
const ground = new THREE.Mesh(new THREE.CircleGeometry(400, 48), new THREE.MeshStandardNodeMaterial({ color: 0x6a6e74, roughness: 0.92 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
// A sky to reflect, as in the game: metal with nothing to mirror reads as a black hole
{
  const { color, normalWorld, mix, smoothstep } = await import('three/tsl');
  const dome = new THREE.Scene();
  const sky = new THREE.MeshBasicNodeMaterial({ side: THREE.BackSide });
  const up = normalWorld.y.negate();
  sky.colorNode = mix(mix(color(0x8f8a82), color(0xcfd9e6), smoothstep(-0.05, 0.12, up)), color(0x5f8fd0), smoothstep(0.1, 0.9, up)).mul(1.15);
  dome.add(new THREE.Mesh(new THREE.SphereGeometry(30, 32, 16), sky));
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(3, 16, 8), new THREE.MeshBasicNodeMaterial({ color: 0xfff4e0 }));
  lamp.material.colorNode = color(0xfff4e0).mul(14);
  lamp.position.set(11, 21, 15);
  dome.add(lamp);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = (await pmrem.fromSceneAsync?.(dome, 0.02) ?? pmrem.fromScene(dome, 0.02)).texture;
  scene.environmentIntensity = +(q.get('env') || 0.9);
}
scene.updateMatrixWorld(true);
scene.matrixWorldAutoUpdate = false;

await loadCharacters();
const look = LOOKS[q.get('look') || 'hero'];
const carry = (q.get('carry') ?? 'pistol,smg,shotgun,rifle').split(',').filter(Boolean);
const setups = (q.get('set') || 'pistol:carry,pistol:ready,pistol:aim,rifle:carry,rifle:ready,rifle:aim').split(',').map((s) => s.split(':'));
const cams = (q.get('cams') || '180:8:2.7,115:6:2.5,35:6:2.5').split(',').map((s) => s.split(':').map(Number));
const pitch = +(q.get('pitch') || 0);
const flat = () => 0;
const cast = [];
const dt = 1 / 60;
for (const [i, [kind, state = 'carry', speed = '0']] of setups.entries()) {
  const x = i * 16, v = +speed, z0 = i * 16;
  const rig = new PersonRig({ seed: 3 });
  rig.reset(x, z0, 0, flat);
  const model = new CharacterModel(scene, rig, look, 'Studio');
  model.setLoadout(carry);
  const [name, at] = state.split('@');
  const k = kind === '-' ? null : kind;
  let z = z0;
  const step = (n, h = dt) => { for (let f = 0; f < n; f++) { z += v * h; rig.update(h, x, z, 0, flat); model.update(true, 0, h); } };
  const aim = () => { rig.aim = { x, y: 1.55 + Math.tan(pitch) * 20, z: z + 20, shoulder: +(q.get('shoulder') || 1) }; };
  if (name === 'stow') { model.setWeapon(null, true); step(60); }
  else if (name === 'draw' || name === 'holster') {
    const drawing = name === 'draw';
    model.setWeapon(drawing ? null : k, true);
    rig.gunReady = true;
    step(60);
    model.setWeapon(drawing ? k : null);
    const want = +(at ?? 0.5);
    for (let f = 0; f < 400; f++) {
      step(1, 1 / 240);
      if (q.get('aimdraw')) aim();
      if (drawing ? model.driver.swap >= want : model.driver.swap <= want) break;
    }
  } else {
    model.setWeapon(k, true);
    rig.gunReady = name !== 'carry';
    if (name === 'aim' || name === 'fire' || name === 'reload') aim();
    if (name === 'reload') rig.reloading = +(at ?? 0.4);
    for (let f = 0; f < 90; f++) { step(1); if (rig.aim) aim(); }
    if (name === 'fire') { model.fired(+(at ?? 1)); step(1, 1 / 27); }
  }
  cast.push({ x, z, model, label: `${kind} ${state}${v ? ' ' + v + ' m/s' : ''}` });
}
window.__studio = { cast, surface: cast[0].model.driver.skeleton.surface };
const middle = (cast.length - 1) * 8;
sun.position.set(middle + 2.2, 4.2, middle + 3);
sun.target.position.set(middle, 0, middle);
scene.add(sun.target);
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -middle * 1.5 - 4, right: middle * 1.5 + 4, top: middle + 5, bottom: -middle - 5 });
sun.shadow.camera.updateProjectionMatrix();
sun.updateMatrixWorld(true);
sun.target.updateMatrixWorld(true);

// &flip=1 lays the set-ups out as columns (a sequence read left to right) and the cameras as rows
const flip = q.get('flip') === '1';
const W = innerWidth, H = innerHeight, cw = Math.floor(W / (flip ? cast.length : cams.length)), ch = Math.floor(H / (flip ? cams.length : cast.length));
const cell = (r, k) => flip ? [r * cw, k * ch] : [k * cw, r * ch];
const camera = new THREE.PerspectiveCamera(+(q.get('fov') || 32), cw / ch, 0.05, 80);
const ty = +(q.get('ty') || 1.1);
const labels = document.getElementById('labels');
const draw = async () => {
  renderer.autoClear = false;
  renderer.setScissorTest(true);
  for (const [r, c] of cast.entries()) for (const [k, [az, el, dist]] of cams.entries()) {
    const a = az * Math.PI / 180, e = el * Math.PI / 180;
    // &focus=gun frames the weapon in hand rather than the body
    const g = q.get('focus') === 'gun' && c.model.driver.gunKind ? c.model.driver.gunP : null;
    const tx = g ? g.x : c.x, tyy = g ? g.y : ty, tz = g ? g.z : c.z;
    camera.position.set(tx + Math.sin(a) * Math.cos(e) * dist, tyy + Math.sin(e) * dist, tz + Math.cos(a) * Math.cos(e) * dist);
    camera.lookAt(tx, tyy, tz);
    camera.updateMatrixWorld();
    const [left, top] = cell(r, k);
    renderer.setViewport(left, top, cw, ch);
    renderer.setScissor(left, top, cw, ch);
    await renderer.renderAsync(scene, camera);
  }
};
for (const [r, c] of cast.entries()) for (const [k, cam] of cams.entries()) {
  const tag = document.createElement('span');
  tag.textContent = `${c.label} · ${cam.join(':')}`;
  const [left, top] = cell(r, k);
  tag.style.left = left + 4 + 'px';
  tag.style.top = top + 4 + 'px';
  labels.append(tag);
}
await draw();
await new Promise((r) => setTimeout(r, 400));
renderer.setScissorTest(false);
renderer.setViewport(0, 0, W, H);
await renderer.clearAsync();
await draw();
document.title = 'done';
</script>
