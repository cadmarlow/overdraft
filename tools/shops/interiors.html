<!doctype html>
<meta charset="utf-8">
<title>Shop interiors</title>
<style>body { margin: 0; background: #000; } canvas { display: block; }</style>
<script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.180.0",
      "three/": "https://esm.sh/three@0.180.0/",
      "three-mesh-bvh": "https://esm.sh/three-mesh-bvh@0.9.13?external=three",
      "three-gpu-pathtracer": "https://esm.sh/three-gpu-pathtracer@0.0.24?external=three,three-mesh-bvh"
    }
  }
</script>
<script>
  window.addEventListener('error', (e) => { window.__result = { error: String(e.message) }; });
  window.addEventListener('unhandledrejection', (e) => { window.__result = { error: String(e.reason && (e.reason.stack || e.reason)) }; });
</script>
<script type="module">
// The rooms behind the shop windows, one per kind of shop, path traced (three-gpu-pathtracer) from a fixed eye 3 m in
// front of the glass. Each room is 6 m wide, 3.4 m high and 5 m deep; the image covers exactly its front opening, so the
// game's glass shader can project any point it hits in the room back onto the image. Furniture near the glass is also
// rendered on its own layer (with coverage), which the shader slides against the room for parallax.
import * as THREE from 'three';
import { WebGLPathTracer } from 'three-gpu-pathtracer';

const params = new URLSearchParams(location.search);
const SAMPLES = Number(params.get('samples') || 160);
const ONLY = params.get('only');
const W = 6, H = 3.4, D = 5, EYE = { x: 3, y: 1.6, z: 3 }, MID = 1.2;
const PX = 768, PY = Math.round(PX * H / W);
const TYPES = ['vacant', 'bodega', 'pizza', 'cafe', 'bakery', 'takeout', 'sushi', 'latin', 'restaurant', 'bar', 'diner', 'juice',
  'laundromat', 'cleaners', 'barber', 'salon', 'pharmacy', 'bank', 'boutique', 'luxury', 'jewelry', 'phones', 'hardware', 'florist',
  'liquor', 'books', 'office', 'souvenir', 'shoes', 'gallery'];

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(PX, PY);
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const tracer = new WebGLPathTracer(renderer);
tracer.bounces = 5;
tracer.filterGlossyFactor = 0.5;
tracer.renderDelay = 0;
tracer.fadeDuration = 0;
tracer.minSamples = 1;
tracer.dynamicLowRes = false;
tracer.tiles.set(2, 2);

// Eye 3 m out, frustum through the room's front opening (x 0..6, y 0..3.4 at z = 0)
const camera = new THREE.PerspectiveCamera(2 * Math.atan(1.8 / EYE.z) * 180 / Math.PI, W / 3.6, 0.05, 50);
camera.position.set(EYE.x, EYE.y, EYE.z);
camera.lookAt(EYE.x, EYE.y, 0);
camera.setViewOffset(PX, Math.round(PY * 3.6 / H), 0, 0, PX, PY);
camera.updateProjectionMatrix();

// ---- Seeded randomness ------------------------------------------------------------------------------------------------
let seed = 1;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const pick = (a) => a[Math.floor(rnd() * a.length)];
const range = (a, b) => a + rnd() * (b - a);

// ---- Textures painted on canvases --------------------------------------------------------------------------------------
const FONTS = ['Oswald', 'Anton', 'PlayfairDisplay', 'BebasNeue', 'JosefinSans', 'Bitter', 'Lobster', 'ArchivoBlack'];
for (const f of FONTS) {
  const face = new FontFace(f, `url(fonts/${f}.ttf)`);
  await face.load();
  document.fonts.add(face);
}
function canvasTexture(w, h, draw, alpha = false) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  if (!alpha) { g.fillStyle = '#000'; g.fillRect(0, 0, w, h); }
  draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
const hsl = (h, s, l) => `hsl(${h},${s}%,${l}%)`;
const BRIGHT = () => hsl(Math.floor(rnd() * 360), 55 + rnd() * 35, 35 + rnd() * 30);

// Rows of goods for one shelf: an alpha texture, items standing on its bottom edge
function goodsTexture(kind, w = 1024, h = 128) {
  return canvasTexture(w, h, (g) => {
    let x = 4;
    while (x < w - 10) {
      const iw = kind === 'bottles' ? range(14, 22) : kind === 'books' ? range(7, 16) : kind === 'cans' ? range(16, 22)
        : kind === 'pharmacy' ? range(18, 34) : kind === 'phones' ? range(26, 34) : kind === 'shoes' ? range(46, 64) : kind === 'polish' ? range(8, 11) : range(18, 40);
      const ih = kind === 'bottles' ? range(80, 118) : kind === 'books' ? range(70, 118) : kind === 'cans' ? range(36, 48)
        : kind === 'pharmacy' ? range(38, 70) : kind === 'phones' ? range(48, 56) : kind === 'shoes' ? range(26, 34) : kind === 'polish' ? range(22, 30) : range(40, 96);
      const y = h - ih;
      const c = BRIGHT();
      g.fillStyle = c;
      if (kind === 'bottles') {
        g.fillStyle = pick(['#2d4a1e', '#5a2a10', '#1a1a1a', '#6a6a3a', '#3a1018', '#c8b070', '#203a5a']);
        g.fillRect(x, y + ih * 0.35, iw, ih * 0.65);
        g.fillRect(x + iw * 0.35, y, iw * 0.3, ih * 0.4);
        g.fillStyle = pick(['#f0e8d0', '#d8c080', '#ffffff', '#c03030']);
        g.fillRect(x + 1, y + ih * 0.55, iw - 2, ih * 0.22);
      } else if (kind === 'books') {
        g.fillRect(x, y, iw, ih);
        g.fillStyle = 'rgba(255,240,200,0.7)';
        g.fillRect(x + 1, y + ih * 0.15, iw - 2, 3);
        g.fillRect(x + 1, y + ih * 0.8, iw - 2, 2);
      } else if (kind === 'phones') {
        g.fillStyle = '#111';
        g.fillRect(x, y, iw, ih);
        const sg = g.createLinearGradient(x, y, x + iw, y + ih);
        sg.addColorStop(0, BRIGHT()); sg.addColorStop(1, BRIGHT());
        g.fillStyle = sg;
        g.fillRect(x + 2, y + 3, iw - 4, ih - 6);
        x += 8;
      } else if (kind === 'shoes') {
        g.beginPath();
        g.moveTo(x, h); g.lineTo(x, y + ih * 0.3); g.quadraticCurveTo(x + iw * 0.3, y, x + iw * 0.45, y + ih * 0.35);
        g.quadraticCurveTo(x + iw * 0.8, y + ih * 0.45, x + iw, y + ih * 0.8); g.lineTo(x + iw, h); g.fill();
        g.fillStyle = '#eee'; g.fillRect(x, h - 6, iw, 6);
        x += 18;
      } else if (kind === 'cans') {
        g.fillRect(x, y, iw, ih);
        g.fillStyle = 'rgba(255,255,255,0.55)'; g.fillRect(x + 2, y + ih * 0.3, iw - 4, ih * 0.25);
      } else {
        g.fillRect(x, y, iw, ih);
        g.fillStyle = kind === 'pharmacy' ? '#ffffff' : BRIGHT();
        g.fillRect(x, y + ih * (kind === 'pharmacy' ? 0.1 : 0.55), iw, ih * (kind === 'pharmacy' ? 0.55 : 0.2));
        if (kind === 'pharmacy') { g.fillStyle = BRIGHT(); g.fillRect(x, y + ih * 0.2, iw, 4); }
        g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(x + iw - 2, y, 2, ih);
      }
      x += iw + (kind === 'books' ? range(0, 1.5) : range(1, 4));
      if (rnd() < 0.04) x += range(10, 40);
    }
  }, true);
}
function clothesTexture(w = 1024, h = 256, palette) {
  return canvasTexture(w, h, (g) => {
    let x = 6;
    while (x < w - 20) {
      const gw = range(18, 34), gh = range(130, 230);
      g.fillStyle = palette ? pick(palette) : BRIGHT();
      g.beginPath();
      g.moveTo(x + gw * 0.5, 8); g.lineTo(x + gw, 30); g.lineTo(x + gw, gh); g.lineTo(x, gh); g.lineTo(x, 30); g.closePath(); g.fill();
      g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(x + gw - 3, 30, 3, gh - 30);
      g.strokeStyle = '#999'; g.lineWidth = 2; g.beginPath(); g.moveTo(x + gw * 0.5, 0); g.lineTo(x + gw * 0.5, 10); g.stroke();
      x += gw * range(0.45, 0.8);
    }
  }, true);
}
function menuTexture(title, w = 1024, h = 384, style = 'dark') {
  return canvasTexture(w, h, (g) => {
    g.fillStyle = style === 'dark' ? '#141414' : style === 'red' ? '#a01c1c' : '#f4f0e6';
    g.fillRect(0, 0, w, h);
    const ink = style === 'light' ? '#1a1a1a' : '#f6f0d8';
    g.fillStyle = ink;
    g.font = `64px Oswald`;
    g.fillText(title, 30, 76);
    const cols = 3;
    for (let c = 0; c < cols; c++) {
      for (let i = 0; i < 6; i++) {
        const x = 30 + c * (w / cols), y = 120 + i * 42;
        if (rnd() < 0.3) { g.fillStyle = BRIGHT(); g.fillRect(x, y - 24, 56, 34); g.fillStyle = ink; }
        g.font = '24px Oswald';
        g.fillText(pick(['SPECIAL', 'COMBO', 'PLATTER', 'SANDWICH', 'SOUP', 'SALAD', 'BURGER', 'NOODLES', 'WINGS', 'WRAP', 'BOWL', 'SLICE', 'COFFEE', 'TEA']), x + 66, y);
        g.fillText('$' + (range(3, 18)).toFixed(2), x + w / cols - 120, y);
      }
    }
  });
}
function artTexture(w = 512, h = 512) {
  return canvasTexture(w, h, (g) => {
    g.fillStyle = hsl(rnd() * 360, 20, 90); g.fillRect(0, 0, w, h);
    for (let i = 0; i < 8; i++) {
      g.fillStyle = hsl(rnd() * 360, 60, 30 + rnd() * 50);
      if (rnd() < 0.5) g.fillRect(rnd() * w, rnd() * h, rnd() * w * 0.6, rnd() * h * 0.6);
      else { g.beginPath(); g.arc(rnd() * w, rnd() * h, rnd() * w * 0.3, 0, 7); g.fill(); }
    }
  });
}
function posterTexture(text) {
  return canvasTexture(256, 384, (g) => {
    g.fillStyle = BRIGHT(); g.fillRect(0, 0, 256, 384);
    g.fillStyle = BRIGHT(); g.fillRect(20, 30, 216, 220);
    g.fillStyle = '#fff'; g.font = '40px Anton'; g.fillText(text, 20, 320);
  });
}

// ---- Materials and parts ------------------------------------------------------------------------------------------------
const mats = new Map();
function mat(color, rough = 0.6, metal = 0, extra = {}) {
  const key = [color, rough, metal, JSON.stringify(extra)].join('|');
  if (!mats.has(key)) mats.set(key, new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, ...extra }));
  return mats.get(key);
}
const emissive = (color, intensity) => new THREE.MeshStandardMaterial({ color: 0x000000, emissive: color, emissiveIntensity: intensity });
let scene, mid;
function add(mesh, toMid = false) { (toMid ? mid : scene).add(mesh); return mesh; }
function box(x0, x1, y0, y1, z0, z1, material, toMid = false) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x1 - x0), Math.abs(y1 - y0), Math.abs(z1 - z0)), material);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return add(m, toMid);
}
// A plane facing +z (towards the glass) at depth z, or facing +x / -x on a side wall
function plane(x0, x1, y0, y1, z, material, toMid = false, facing = 'front') {
  const w = Math.abs(x1 - x0), h = y1 - y0;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), material);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, z);
  if (facing === 'right') { m.rotation.y = Math.PI / 2; m.position.set(x0, (y0 + y1) / 2, z); }
  if (facing === 'left') { m.rotation.y = -Math.PI / 2; m.position.set(x0, (y0 + y1) / 2, z); }
  return add(m, toMid);
}
function cyl(x, z, r, y0, y1, material, toMid = false, seg = 20) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, y1 - y0, seg), material);
  m.position.set(x, (y0 + y1) / 2, z);
  return add(m, toMid);
}
function sphere(x, y, z, r, material, toMid = false) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), material);
  m.position.set(x, y, z);
  return add(m, toMid);
}
const goodsMat = (kind) => new THREE.MeshStandardMaterial({ map: goodsTexture(kind), transparent: true, alphaTest: 0.5, roughness: 0.55 });

// Shell: floor, ceiling, back and side walls
function shell({ wall, floor, ceiling = 0xe8e6e0, floorRough = 0.5, wallRough = 0.85, tin = false }) {
  plane(0, W, 0, H, -D, mat(wall, wallRough));
  plane(0, W, 0, H, 0, mat(wall, wallRough), false, 'right').position.set(0, H / 2, -D / 2);
  scene.children[scene.children.length - 1].scale.x = D / W;
  const right = plane(0, W, 0, H, 0, mat(wall, wallRough), false, 'left');
  right.position.set(W, H / 2, -D / 2); right.scale.x = D / W;
  const f = new THREE.Mesh(new THREE.PlaneGeometry(W, D + 0.1), mat(floor, floorRough));
  f.rotation.x = -Math.PI / 2; f.position.set(W / 2, 0, -D / 2 + 0.05); scene.add(f);
  const c = new THREE.Mesh(new THREE.PlaneGeometry(W, D + 0.1), mat(ceiling, tin ? 0.4 : 0.9, tin ? 0.3 : 0));
  c.rotation.x = Math.PI / 2; c.position.set(W / 2, H, -D / 2 + 0.05); scene.add(c);
}
// Lights: fluorescent troffers, warm pendants or track spots
function troffers(rows = 2, cols = 3, power = 5, colour = 0xf4f8ff) {
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    const x = W * (i + 0.5) / cols, z = -D * (j + 0.5) / rows;
    const panel = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.6), emissive(colour, 2.2));
    panel.rotation.x = Math.PI / 2; panel.position.set(x, H - 0.01, z); scene.add(panel);
    const l = new THREE.RectAreaLight(colour, power, 1.2, 0.6);
    l.position.set(x, H - 0.02, z); l.lookAt(x, 0, z); scene.add(l);
  }
}
function pendants(n = 3, colour = 0xffc890, power = 6, low = 1.0) {
  for (let i = 0; i < n; i++) for (const z of [-1.4, -3.4]) {
    const x = W * (i + 0.5) / n;
    cyl(x, z, 0.01, H - low, H, mat(0x111111, 0.5, 0.5));
    const shade = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.25, 20, 1, true), mat(0x1a1a1a, 0.4, 0.6, { side: THREE.DoubleSide }));
    shade.position.set(x, H - low - 0.1, z); scene.add(shade);
    sphere(x, H - low - 0.2, z, 0.07, emissive(colour, 12));
    const l = new THREE.PointLight(colour, power, 0, 2); l.position.set(x, H - low - 0.28, z); scene.add(l);
  }
}
function spots(n = 4, colour = 0xfff0d8, power = 30) {
  box(0.3, W - 0.3, H - 0.06, H - 0.03, -1.5, -1.45, mat(0x111111, 0.4, 0.6));
  for (let i = 0; i < n; i++) {
    const x = W * (i + 0.5) / n;
    cyl(x, -1.48, 0.05, H - 0.2, H - 0.06, mat(0x151515, 0.35, 0.7));
    for (const tz of [-D + 0.1, -0.3]) {
      const l = new THREE.SpotLight(colour, power, 0, 0.6, 0.6, 2);
      l.position.set(x, H - 0.22, -1.48); l.target.position.set(x + range(-1, 1), 1.0, tz); scene.add(l, l.target);
    }
  }
}
function fill(power = 0.5) {
  const h = new THREE.HemisphereLight(0xffffff, 0x404040, power); scene.add(h);
}

// Furniture
// Shelves whose fronts stand at z (their back panel 0.42 m behind it)
function wallShelves(x0, x1, z, kinds, { y0 = 0.15, y1 = 2.3, rows = 5, wood = 0xd8d4cc, toMid = false } = {}) {
  box(x0, x1, y0, y1, z - 0.42, z - 0.4, mat(wood, 0.8), toMid);
  for (let i = 0; i <= rows; i++) {
    const y = y0 + (y1 - y0) * i / rows;
    box(x0, x1, y, y + 0.025, z - 0.42, z, mat(wood, 0.7), toMid);
    if (i < rows) plane(x0 + 0.02, x1 - 0.02, y + 0.025, y + 0.025 + (y1 - y0) / rows * 0.86, z - 0.12, goodsMat(pick(kinds)), toMid);
  }
}
function sideShelves(side, z0, z1, kinds, opts = {}) {
  // Along a side wall: shelves facing into the room
  const g = new THREE.Group();
  const prev = scene; scene = g;
  wallShelves(0, z1 - z0, 0, kinds, opts);
  scene = prev;
  // Turned to face into the room, its back panel against the wall
  g.rotation.y = side === 'left' ? Math.PI / 2 : -Math.PI / 2;
  g.position.set(side === 'left' ? 0.44 : W - 0.44, 0, side === 'left' ? z1 : z0);
  scene.add(g);
}
function gondola(x, z0, z1, kinds, h = 1.6) {
  // A double-sided aisle running back from the glass
  box(x - 0.45, x + 0.45, 0, 0.12, z1, z0, mat(0xdddddd, 0.6));
  box(x - 0.03, x + 0.03, 0, h, z1, z0, mat(0xe6e6e6, 0.6));
  for (let i = 0; i < 4; i++) {
    const y = 0.15 + i * (h - 0.2) / 4;
    box(x - 0.45, x + 0.45, y, y + 0.02, z1, z0, mat(0xe0e0e0, 0.5));
  }
  // End cap facing the glass, with goods
  const cap = new THREE.Mesh(new THREE.PlaneGeometry(0.88, h - 0.15), goodsMat(pick(kinds)));
  cap.position.set(x, (h + 0.1) / 2, z0 + 0.01); scene.add(cap);
  for (const side of [-1, 1]) {
    const p = new THREE.Mesh(new THREE.PlaneGeometry(Math.abs(z1 - z0), h - 0.15), goodsMat(pick(kinds)));
    p.rotation.y = side * Math.PI / 2; p.position.set(x + side * 0.46, (h + 0.1) / 2, (z0 + z1) / 2); scene.add(p);
  }
}
function counter(x0, x1, z, { h = 1.0, front = 0x5a4030, top = 0x2a2a2a, toMid = false } = {}) {
  box(x0, x1, 0, h, z - 0.6, z, mat(front, 0.6), toMid);
  box(x0 - 0.03, x1 + 0.03, h, h + 0.04, z - 0.65, z + 0.04, mat(top, 0.25, 0.1), toMid);
}
function register(x, z, toMid = false) {
  box(x - 0.2, x + 0.2, 1.04, 1.14, z - 0.4, z - 0.15, mat(0x1a1a1a, 0.4), toMid);
  const s = box(x - 0.15, x + 0.15, 1.14, 1.34, z - 0.35, z - 0.33, emissive(0x80b0ff, 1.2), toMid);
  s.rotation.x = -0.3;
}
function fridge(x0, x1, z, { doors = 3 } = {}) {
  // A hollow cabinet: top, plinth, ends and back, lit inside
  const body = mat(0x202020, 0.5, 0.3);
  box(x0, x1, 1.95, 2.1, z - 0.7, z, body);
  box(x0, x1, 0, 0.15, z - 0.7, z, body);
  box(x0, x0 + 0.04, 0, 2.1, z - 0.7, z, body);
  box(x1 - 0.04, x1, 0, 2.1, z - 0.7, z, body);
  box(x0, x1, 0.15, 1.95, z - 0.7, z - 0.68, body);
  const w = (x1 - x0) / doors;
  for (let i = 0; i < doors; i++) {
    const a = x0 + i * w + 0.04, b = a + w - 0.08;
    box(a, b, 0.15, 1.95, z - 0.68, z - 0.67, emissive(0xe8f4ff, 0.9));
    for (let k = 0; k < 5; k++) box(a, b, 0.2 + k * 0.35, 0.215 + k * 0.35, z - 0.66, z - 0.04, mat(0xd0d8e0, 0.3, 0.2));
    for (let k = 0; k < 5; k++) plane(a + 0.02, b - 0.02, 0.2 + k * 0.35, 0.2 + k * 0.35 + 0.3, z - 0.3, goodsMat(pick(['bottles', 'cans'])));
    box(a - 0.02, a, 0.15, 1.95, z - 0.03, z, mat(0x888888, 0.3, 0.8));
    box(b - 0.03, b - 0.01, 0.9, 1.3, z - 0.02, z + 0.03, mat(0xcccccc, 0.2, 1));
  }
  const l = new THREE.RectAreaLight(0xe8f4ff, 3, x1 - x0, 1.8); l.position.set((x0 + x1) / 2, 1.05, z - 0.05); l.lookAt((x0 + x1) / 2, 1.05, 5); scene.add(l);
}
function displayCase(x0, x1, z, { items = 'pastry', h = 1.1, toMid = false } = {}) {
  box(x0, x1, 0, h - 0.35, z - 0.7, z, mat(0x3a2a20, 0.5), toMid);
  box(x0, x1, h - 0.35, h - 0.33, z - 0.7, z, mat(0xd8d0c0, 0.4), toMid);
  const n = Math.floor((x1 - x0) / 0.16);
  for (let i = 0; i < n; i++) for (let k = 0; k < 3; k++) {
    const x = x0 + 0.1 + i * 0.16, zz = z - 0.15 - k * 0.2;
    if (items === 'pastry') sphere(x, h - 0.28, zz, 0.05, mat(pick([0xc08040, 0xe0b070, 0x704020, 0xf0e0d0, 0xd06080]), 0.7), toMid);
    else if (items === 'pizza') { const p = cyl(x0 + 0.25 + (i % 4) * 0.45, zz - 0.1, 0.2, h - 0.33, h - 0.31, mat(pick([0xd09040, 0xc06030, 0xe0c060]), 0.8), toMid); if (i >= 4) break; }
    else if (items === 'gold') sphere(x, h - 0.3, zz, 0.018, mat(0xffd070, 0.15, 1), toMid);
  }
  box(x0, x1, h - 0.33, h, z - 0.71, z - 0.69, new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: 1, roughness: 0.02, thickness: 0.01 }), toMid);
  const l = new THREE.PointLight(0xfff0d8, 1.2, 0, 2); l.position.set((x0 + x1) / 2, h - 0.05, z - 0.35); scene.add(l);
}

// ---- Render each room ---------------------------------------------------------------------------------------------------------
async function trace(target) {
  tracer.setScene(target, camera);
  tracer.reset();
  for (let i = 0; i < SAMPLES; i++) {
    tracer.renderSample();
    if (i % 20 === 19) await new Promise((r) => setTimeout(r, 0));
  }
  return renderer.domElement.toDataURL('image/png');
}
// The same picture in white, keeping its alpha (a canvas texture's coverage)
function whiteVersion(tex) {
  const src = tex.image;
  const c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  const g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height);
  for (let i = 0; i < d.data.length; i += 4) d.data[i] = d.data[i + 1] = d.data[i + 2] = 255;
  g.putImageData(d, 0, 0);
  return new THREE.CanvasTexture(c);
}
function coverage(group) {
  // Plain raster pass: what the near furniture covers, white on black
  const s = new THREE.Scene();
  s.background = new THREE.Color(0x000000);
  const white = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const clone = group.clone(true);
  clone.traverse((o) => {
    if (!o.isMesh) return;
    const src = o.material;
    o.material = src.map ? new THREE.MeshBasicMaterial({ map: whiteVersion(src.map), alphaTest: 0.5, side: src.side }) : white;
  });
  s.add(clone);
  renderer.setRenderTarget(null);
  renderer.render(s, camera);
  return renderer.domElement.toDataURL('image/png');
}

const streetLight = (() => {
  const w = 64, h = 32, data = new Float32Array(w * h * 4);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const up = 1 - y / h, v = 0.25 + up * 0.5;
    data.set([v * 0.95, v, v * 1.08, 1], (y * w + x) * 4);
  }
  const t = new THREE.DataTexture(data, w, h, THREE.RGBAFormat, THREE.FloatType);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.needsUpdate = true;
  return t;
})();
const out = {};
for (const id of TYPES) {
  if (ONLY && !ONLY.split(',').includes(id)) continue;
  seed = 1 + TYPES.indexOf(id) * 7919;
  scene = new THREE.Scene();
  mid = new THREE.Group();
  scene.background = new THREE.Color(0x000000);
  // The street outside the window: a soft grey sky that lights the room through its open front
  scene.environment = streetLight;
  scene.environmentIntensity = 0.5;
  ROOMS[id]();
  // Room alone, then room and near furniture together, then the near furniture's coverage
  const back = await trace(scene);
  scene.add(mid);
  const full = mid.children.length ? await trace(scene) : null;
  const mask = mid.children.length ? coverage(mid) : null;
  out[id] = { back, full, mask };
  console.log('rendered', id);
  scene.traverse((o) => { if (o.isMesh) o.geometry.dispose(); });
}
window.__result = { size: [PX, PY], rooms: out, eye: EYE, room: [W, H, D], mid: MID };
